trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

resources:
  repositories:
  - repository: devops
    type: git
    name: Automation/devops-templates

variables:
- name: IMAGE_NAME
  value: policyanalyzai/api
- name: IMAGE_TAG
  value: "$(Build.BuildNumber)"
- name: DEV_ACR_NAME
  value: polanalyaidevacr
- name: PROD_ACR_NAME
  value: polanalyaiprodacr
- name: DEV_APP_SERVICE_NAME
  value: polanalyai-infra-dev-api
- name: PROD_APP_SERVICE_NAME
  value: polanalyai-infra-prod-api
- name: DEV_RESOURCE_GROUP
  value: polanalyai-infra-dev-rg
- name: PROD_RESOURCE_GROUP
  value: polanalyai-infra-prod-rg
- group: PolicyAnalyzAIInfra

pool:
  vmImage: "ubuntu-latest"

stages:
# ── Stage 1: Build & Test (PR + main) ─────────────────────────────────────
- stage: BuildAndTest
  displayName: Build & Test
  jobs:
  - job: BuildAndTest
    displayName: Build & Test
    steps:
    - task: UsePythonVersion@0
      displayName: Use Python 3.12
      inputs:
        versionSpec: "3.12"

    - script: |
        pip install --no-cache-dir -r requirements.txt
        pytest --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml -v
      displayName: Install dependencies & run tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: "$(Build.ArtifactStagingDirectory)/test-results.xml"
        failTaskOnFailedTests: true

# ── Stage 2: Publish to Docker (main only) ────────────────────────────────
- stage: PublishToDocker
  displayName: Publish to Docker
  dependsOn: BuildAndTest
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: PushImage
    displayName: Build & push to $(DEV_ACR_NAME)
    steps:
    - task: AzureCLI@2
      displayName: Docker build & push → $(DEV_ACR_NAME)
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(DEV_ACR_NAME)
          docker build -t $(DEV_ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG) .
          docker push $(DEV_ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)

# ── Stage 3: Deploy to Dev/CI (main only) ─────────────────────────────────
- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: PublishToDocker
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: UpdateDevAppService
    displayName: Update Dev App Service
    steps:
    - task: AzureCLI@2
      displayName: Point $(DEV_APP_SERVICE_NAME) → $(IMAGE_NAME):$(IMAGE_TAG)
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az webapp config container set \
            --name $(DEV_APP_SERVICE_NAME) \
            --resource-group $(DEV_RESOURCE_GROUP) \
            --container-image-name $(DEV_ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)

          az webapp restart \
            --name $(DEV_APP_SERVICE_NAME) \
            --resource-group $(DEV_RESOURCE_GROUP)

# ── Stage 4: Approval gate for Prod ───────────────────────────────────────
- template: utils/templates/stages/stage-approve-and-prepare-release.yml@devops
  parameters:
    STAGE_DEPENDENCY: [ DeployToDev ]
    STAGE_DISPLAY_NAME: "Approve Prod"
    TESTERS_EMAILS: $(TESTERS_EMAILS)
    STAGE_NAME: "ApproveProd"

# ── Stage 5: Deploy to Prod (main only) ───────────────────────────────────
- stage: DeployToProd
  displayName: Deploy to Prod
  dependsOn: ApproveProd
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: DeployProd
    displayName: Promote image & deploy to Prod
    steps:
    - task: AzureCLI@2
      displayName: Import image into $(PROD_ACR_NAME) & deploy
      inputs:
        azureSubscription: $(AZURE_SUBSCRIPTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr import \
            --name $(PROD_ACR_NAME) \
            --source $(DEV_ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG) \
            --image $(IMAGE_NAME):$(IMAGE_TAG) \
            --force

          az webapp config container set \
            --name $(PROD_APP_SERVICE_NAME) \
            --resource-group $(PROD_RESOURCE_GROUP) \
            --container-image-name $(PROD_ACR_NAME).azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)

          az webapp restart \
            --name $(PROD_APP_SERVICE_NAME) \
            --resource-group $(PROD_RESOURCE_GROUP)
